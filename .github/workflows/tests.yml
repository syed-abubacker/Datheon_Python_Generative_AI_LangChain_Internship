name: Offline unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ["task 1", "task 2", "task 3", "task 4"]
    defaults:
      run:
        working-directory: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install task dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run API-free unit tests
        run: pytest -q

